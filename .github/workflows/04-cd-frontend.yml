name: 04-cd-frontend.yml
on:
  push:
    branches:
      - deploy
    paths:
      - 'Valdo-Frontend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log en Docker
      uses: docker/login-action@v2
      with:
        username: ${{secrets.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_PASSWORD}}

    - name: Build and Push en Docker Imagen
      uses: docker/build-push-action@v4
      with:
        context: ./Valdo-Frontend
        file: ./Valdo-Frontend/Dockerfile
        push: true
        tags: ${{secrets.DOCKER_USERNAME}}/valdo-frontend:latest

    - name: Trigger Render Deploy
      run: |
       curl -X POST ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK  }}


